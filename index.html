<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>3D Portrait</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06070b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.app{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#252b50 0,#101322 32%,#06070b 70%)}.stage{position:relative;width:100vw;height:78svh;display:grid;place-items:center;perspective:900px;touch-action:none}.rig{width:min(96vw,560px);height:min(72svh,700px);position:relative;transform-style:preserve-3d;will-change:transform;transition:transform 40ms linear}.face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:45%;-webkit-mask-image:radial-gradient(ellipse 58% 62% at 50% 49%,#000 0 70%,rgba(0,0,0,.98) 79%,transparent 98%);mask-image:radial-gradient(ellipse 58% 62% at 50% 49%,#000 0 70%,rgba(0,0,0,.98) 79%,transparent 98%)}.closed{opacity:0}.blink .closed{opacity:1}.blink .open{opacity:0}.title{position:absolute;top:max(18px,env(safe-area-inset-top));font-weight:700;font-size:17px;z-index:5}.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));z-index:10;display:flex;gap:10px}.btn{border:1px solid #ffffff25;background:#ffffff15;color:white;border-radius:16px;padding:13px 17px;font-weight:650;backdrop-filter:blur(15px)}.primary{background:#6474ff}.status{position:absolute;bottom:85px;font-size:12px;color:#ffffff99}</style></head><body><div class="app"><div class="title">Interactive 3D Portrait</div><div class="stage" id="stage"><div class="rig" id="rig"><img class="face open" src="head.jpg"><img class="face closed" src="head-closed.jpg"></div></div><div class="status" id="status">先点击开启动作控制</div><div class="controls"><button class="btn primary" id="motion">开启动作控制</button><button class="btn" id="reset">回正</button></div></div><script>const rig=document.querySelector('#rig'),stage=document.querySelector('#stage'),status=document.querySelector('#status');let tx=0,ty=0,cx=0,cy=0,bB=null,bG=null;function loop(){cx+=(tx-cx)*.14;cy+=(ty-cy)*.14;rig.style.transform='rotateX('+cx+'deg) rotateY('+cy+'deg)';requestAnimationFrame(loop)}loop();function ori(e){if(e.beta==null||e.gamma==null)return;if(bB==null){bB=e.beta;bG=e.gamma}tx=Math.max(-18,Math.min(18,-(e.beta-bB)*.5));ty=Math.max(-25,Math.min(25,(e.gamma-bG)*.7));status.textContent='动作控制已开启 · 倾斜手机试试看'}document.querySelector('#motion').onclick=async()=>{try{if(typeof DeviceOrientationEvent.requestPermission==='function'){let p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw 0}addEventListener('deviceorientation',ori,true);status.textContent='动作控制已开启 · 倾斜手机试试看'}catch(e){status.textContent='未获得动作权限，请在 Safari 设置允许动作感应'}};document.querySelector('#reset').onclick=()=>{bB=bG=null;tx=ty=0};stage.onpointermove=e=>{if(e.pointerType==='mouse'||e.buttons){let r=stage.getBoundingClientRect();ty=((e.clientX-r.left)/r.width-.5)*40;tx=-((e.clientY-r.top)/r.height-.5)*25}};function blink(){rig.classList.add('blink');setTimeout(()=>rig.classList.remove('blink'),110);setTimeout(blink,2200+Math.random()*3500)}setTimeout(blink,1200);</script></body></html>
